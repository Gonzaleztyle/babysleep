    background: var(--bg); color: var(--primary); font-weight: 700; font-family: inherit;

  }

  .btn {
    padding: 12px 20px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform 0.1s, opacity 0.15s; font-family: inherit; -webkit-appearance: none;
  }
  .btn:active { transform: scale(0.96); opacity: 0.8; }
  .btn-primary { background: var(--primary); color: #000; }

  .btn-small { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-warning { background: var(--warning); color: #000; }
  .btn-alert { background: var(--alert); color: #000; }

  .countdown-banner {

  }

  .countdown-banner .countdown-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(0,0,0,0.6); margin-bottom: 4px; }

  .countdown-banner .countdown-event { font-size: 14px; font-weight: 600; color: rgba(0,0,0,0.8); margin-top: 4px; }
