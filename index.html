<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Baby Sleep" />
  <title>Baby Sleep - Tracker de sueño inteligente</title>
  <style>
    :root {
      --bg: #111315;
      --card: #1a1d21;
      --border: #2a2f35;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --green: #10b981;
      --blue: #2563eb;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px 16px 60px; max-width: 480px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: var(--green); font-size: 1.6rem; font-weight: 800; }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .auth-card { text-align: center; }
    .auth-card h2 { color: var(--green); font-size: 1.15rem; margin-bottom: 6px; }
    .auth-card p { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
    .user-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.85rem; }
    .user-info { display: flex; align-items: center; gap: 8px; color: var(--green); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); width: auto; padding: 6px 12px; font-size: 0.8rem; }

    .section-title {
      text-align: center;
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .clock-box { text-align: center; margin-bottom: 14px; }
    .clock-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .clock-value { font-size: 1.5rem; font-weight: 800; color: var(--green); margin-top: 2px; }

    /* Contenedor centrado del input de hora (sin botón "Ahora") */
    .wake-input-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }
    input[type="time"] {
      background: transparent;
      border: 2px solid var(--green);
      color: var(--green);
      font-size: 1.25rem;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 12px;
      text-align: center;
      width: 180px;
      outline: none;
      color-scheme: dark;
    }

    .next-block {
      background: var(--amber);
      color: #111;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      margin-bottom: 16px;
    }
    .next-block .label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .next-block .countdown { font-size: 2rem; font-weight: 900; margin: 4px 0; }
    .next-block .sub { font-size: 0.85rem; font-weight: 600; }

    .timeline-card { background: #fff; color: #111; border-radius: 16px; padding: 18px; }
    .timeline-header { font-size: 0.8rem; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }

    .block-item {
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .block-item.done {
      border-color: #86efac;
      background: #f0fdf4;
    }
    .block-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .block-type { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--green); }
    .block-time { font-size: 0.8rem; color: #6b7280; font-weight: 600; }
    .block-duration { font-size: 1.2rem; font-weight: 800; color: #1f2937; margin-bottom: 6px; }
    .block-actions { display: flex; gap: 8px; align-items: center; }
    .block-actions input[type="time"] {
      border: 1px solid #d1d5db;
      color: #111;
      font-size: 0.85rem;
      padding: 4px 8px;
      width: auto;
      color-scheme: light;
    }
    .btn-check {
      background: #e5e7eb;
      color: #374151;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .block-item.done .btn-check {
      background: var(--green);
      color: #fff;
    }
    .sync-status {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌙 Baby Sleep</h1>
    <p>Tracker de sueño inteligente</p>
  </header>

  <!-- Tarjeta de Autenticación -->
  <div class="card auth-card" id="authCard">
    <div id="loggedOutView">
      <h2>👋 Bienvenido</h2>
      <p>Inicia sesión para sincronizar tus datos en la nube</p>
      <button class="btn btn-blue" id="btnLogin">🔑 Iniciar sesión con Google</button>
    </div>
    <div id="loggedInView" style="display:none;">
      <div class="user-bar">
        <span class="user-info" id="userEmail">Sincronizado</span>
        <button class="btn btn-outline" id="btnLogout">Salir</button>
      </div>
      <div class="sync-status" id="syncStatus">☁️ Datos sincronizados con tu cuenta</div>
    </div>
  </div>

  <!-- Selector de hora de despertar (SIN botón "Ahora") -->
  <div class="card">
    <div class="section-title">🌅 ¿A qué hora despertó hoy?</div>
    <div class="clock-box">
      <div class="clock-label">🕒 Hora actual</div>
      <div class="clock-value" id="currentClock">--:--</div>
    </div>

    <div class="wake-input-wrap">
      <input type="time" id="wakeTimeInput" value="07:00" />
    </div>

    <button class="btn btn-blue" id="btnGenerate">📅 Generar rutina del día</button>
  </div>

  <!-- Próximo bloque -->
  <div class="next-block" id="nextBlockCard" style="display:none;">
    <div class="label">⏰ Próximo bloque en</div>
    <div class="countdown" id="countdownText">--</div>
    <div class="sub" id="nextBlockSub">--</div>
  </div>

  <!-- Rutina del día -->
  <div class="timeline-card" id="timelineCard" style="display:none;">
    <div class="timeline-header">📋 Rutina del día</div>
    <div id="blocksContainer"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPMC66YAtWcrV-UnPcKWGP-ZYs8-jgWR8",
      authDomain: "baby-sleep-tracker-32717.firebaseapp.com",
      projectId: "baby-sleep-tracker-32717",
      storageBucket: "baby-sleep-tracker-32717.firebasestorage.app",
      messagingSenderId: "613276258453",
      appId: "1:613276258453:web:165d74c31c24522d114b9c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let unsubscribeSnapshot = null;

    getRedirectResult(auth).catch(err => {
      console.error("Error redirect auth:", err);
      alert("Error al completar inicio de sesión: " + err.message);
    });

    const todayKey = new Date().toISOString().slice(0, 10);
    let appState = {
      date: todayKey,
      wakeTime: "07:00",
      blocks: []
    };

    const wakeTimeInput = document.getElementById("wakeTimeInput");
    const btnGenerate = document.getElementById("btnGenerate");
    const btnLogin = document.getElementById("btnLogin");
    const btnLogout = document.getElementById("btnLogout");
    const loggedOutView = document.getElementById("loggedOutView");
    const loggedInView = document.getElementById("loggedInView");
    const userEmailEl = document.getElementById("userEmail");
    const syncStatusEl = document.getElementById("syncStatus");
    const blocksContainer = document.getElementById("blocksContainer");
    const timelineCard = document.getElementById("timelineCard");
    const nextBlockCard = document.getElementById("nextBlockCard");

    function timeToMinutes(t) {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      const total = ((mins % 1440) + 1440) % 1440;
      const h = String(Math.floor(total / 60)).padStart(2, "0");
      const m = String(total % 60).padStart(2, "0");
      return `${h}:${m}`;
    }

    function formatDuration(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    async function saveState() {
      localStorage.setItem("babySleepState", JSON.stringify(appState));
      if (currentUser && db) {
        try {
          syncStatusEl.textContent = "⏳ Guardando en la nube...";
          await setDoc(doc(db, "users", currentUser.uid, "routines", appState.date), appState, { merge: true });
          syncStatusEl.textContent = "☁️ Sincronizado con tu cuenta de Google";
        } catch (e) {
          console.error("Error guardando en Firestore:", e);
          syncStatusEl.textContent = "⚠️ Error al sincronizar: " + e.message;
        }
      }
    }

    function loadLocalState() {
      const saved = localStorage.getItem("babySleepState");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.date === todayKey) {
            appState = parsed;
            wakeTimeInput.value = appState.wakeTime;
          }
        } catch (_) {}
      }
      render();
    }

    function getFeedMicroLine(startMins, isFirstAwake, isLastAwake) {
      const milkStr = minutesToTime(startMins + 10);
      const mealStr = minutesToTime(startMins + 45);
      const mealIcon = isFirstAwake ? "🥣" : (isLastAwake ? "🥗" : "🍽️");
      return `🍼 ${milkStr} · ${mealIcon} ${mealStr}`;
    }

    function generateRoutine(wakeStr) {
      const start = timeToMinutes(wakeStr);
      const template = [
        { title: "Ventana despierto", duration: 150, isAwake: true, first: true, last: false },
        { title: "1ª Siesta", duration: 90, isAwake: false },
        { title: "Ventana despierto", duration: 165, isAwake: true, first: false, last: false },
        { title: "2ª Siesta", duration: 75, isAwake: false },
        { title: "Ventana despierto", duration: 195, isAwake: true, first: false, last: true }
      ];

      let cursor = start;
      appState = {
        date: todayKey,
        wakeTime: wakeStr,
        blocks: template.map((item, idx) => {
          const blockStart = cursor;
          const blockEnd = cursor + item.duration;
          const note = item.isAwake ? getFeedMicroLine(blockStart, item.first, item.last) : "";
          cursor = blockEnd;
          return {
            id: idx,
            title: item.title,
            isAwake: item.isAwake,
            first: Boolean(item.first),
            last: Boolean(item.last),
            note,
            start: minutesToTime(blockStart),
            end: minutesToTime(blockEnd),
            duration: item.duration,
            done: false
          };
        })
      };
      saveState();
      render();
    }

    function updateBlockStart(index, newStartStr) {
      let cursor = timeToMinutes(newStartStr);
      for (let i = index; i < appState.blocks.length; i++) {
        const b = appState.blocks[i];
        b.start = minutesToTime(cursor);
        if (b.isAwake) {
          b.note = getFeedMicroLine(cursor, b.first, b.last);
        }
        cursor += b.duration;
        b.end = minutesToTime(cursor);
      }
      saveState();
      render();
    }

    function toggleDone(index) {
      const b = appState.blocks[index];
      b.done = !b.done;
      if (b.done) {
        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();
        const startMins = timeToMinutes(b.start);
        if (nowMins > startMins) {
          b.duration = nowMins - startMins;
          b.end = minutesToTime(nowMins);
          let cursor = nowMins;
          for (let i = index + 1; i < appState.blocks.length; i++) {
            const next = appState.blocks[i];
            next.start = minutesToTime(cursor);
            if (next.isAwake) {
              next.note = getFeedMicroLine(cursor, next.first, next.last);
            }
            cursor += next.duration;
            next.end = minutesToTime(cursor);
          }
        }
      }
      saveState();
      render();
    }

    function render() {
      if (!appState.blocks || appState.blocks.length === 0) {
        timelineCard.style.display = "none";
        nextBlockCard.style.display = "none";
        return;
      }

      timelineCard.style.display = "block";
      blocksContainer.innerHTML = "";

      appState.blocks.forEach((b, idx) => {
        const div = document.createElement("div");
        div.className = `block-item ${b.done ? "done" : ""}`;
        div.innerHTML = `
          <div class="block-top">
            <span class="block-type">${b.title} ${b.done ? "✓" : ""}</span>
            <span class="block-time">${b.start} - ${b.end}</span>
          </div>
          <div class="block-duration">${formatDuration(b.duration)}</div>
          ${b.note ? `<div style="font-size:0.8rem;color:#4b5563;margin-bottom:8px;">${b.note}</div>` : ""}
          <div class="block-actions">
            <input type="time" value="${b.start}" data-idx="${idx}" class="edit-start" />
            <button class="btn-check" data-idx="${idx}">${b.done ? "Completado" : "Marcar listo"}</button>
          </div>
        `;
        blocksContainer.appendChild(div);
      });

      document.querySelectorAll(".edit-start").forEach(inp => {
        inp.addEventListener("change", (e) => {
          updateBlockStart(Number(e.target.dataset.idx), e.target.value);
        });
      });

      document.querySelectorAll(".btn-check").forEach(btn => {
        btn.addEventListener("click", (e) => {
          toggleDone(Number(e.target.dataset.idx));
        });
      });

      updateCountdown();
    }

    function updateCountdown() {
      const now = new Date();
      const nowStr = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      document.getElementById("currentClock").textContent = nowStr;

      if (!appState.blocks || appState.blocks.length === 0) return;

      const nowMins = now.getHours() * 60 + now.getMinutes();
      const pending = appState.blocks.find(b => !b.done && timeToMinutes(b.end) > nowMins);

      if (pending) {
        const diff = timeToMinutes(pending.end) - nowMins;
        nextBlockCard.style.display = "block";
        document.getElementById("countdownText").textContent = formatDuration(diff);
        document.getElementById("nextBlockSub").textContent = `${pending.title} termina a las ${pending.end}`;
      } else {
        nextBlockCard.style.display = "none";
      }
    }

    btnGenerate.addEventListener("click", () => {
      generateRoutine(wakeTimeInput.value || "07:00");
    });

    btnLogin.addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      try {
        if (isMobile) {
          await signInWithRedirect(auth, provider);
        } else {
          await signInWithPopup(auth, provider);
        }
      } catch (err) {
        console.error(err);
        alert("Error al iniciar sesión: " + err.message);
      }
    });

    btnLogout.addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }

      if (user) {
        loggedOutView.style.display = "none";
        loggedInView.style.display = "block";
        userEmailEl.textContent = `👤 ${user.email}`;

        const docRef = doc(db, "users", user.uid, "routines", todayKey);
        unsubscribeSnapshot = onSnapshot(docRef, (snap) => {
          if (snap.exists()) {
            appState = snap.data();
            wakeTimeInput.value = appState.wakeTime;
            localStorage.setItem("babySleepState", JSON.stringify(appState));
            render();
          } else if (appState.blocks.length > 0) {
            saveState();
          }
        }, (err) => {
          console.error("Error snapshot:", err);
          syncStatusEl.textContent = "⚠️ Error de permisos en Firestore";
        });
      } else {
        loggedOutView.style.display = "block";
        loggedInView.style.display = "none";
      }
    });

    loadLocalState();
    setInterval(updateCountdown, 15000);
  </script>
</body>
</html>
