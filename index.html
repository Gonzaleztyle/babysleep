<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baby Sleep">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
<title>Baby Sleep Tracker</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #0a0a0a; --card: #ffffff; --card-alt: #f5f5f5;
    --primary: #00c853; --primary-dark: #009624; --accent: #2962ff;
    --text: #1a1a1a; --text-light: #666; --text-muted: #999;
    --sleep: #2962ff; --sleep-bg: #e3f2fd; --awake: #00c853; --awake-bg: #e8f5e9;
    --border: #e0e0e0; --shadow: 0 4px 20px rgba(0,0,0,0.3);
    --danger: #ff1744; --warning: #ff9100; --warning-bg: #fff3e0; --alert: #ffc107;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    padding: 16px; padding-bottom: 100px; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 480px; margin: 0 auto; }
  
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h1 { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
  .current-time-badge { font-size: 13px; font-weight: 700; color: #fff; background: #222; padding: 4px 10px; border-radius: 12px; border: 1px solid #333; }
  .subtitle { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-dark { background: #1a1a1a; border: 1px solid #333; }
  .section-title {
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .section-title.green { color: var(--primary); }
